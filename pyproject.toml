[project]
name = "mimo-orbit-agent-lab"
version = "0.2.0"
description = "Multi-agent civic content workflow for Indonesian creators, powered by Xiaomi MiMo API"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "feedparser>=6.0.10",
]

[project.scripts]
mimo-orbit = "mimo_orbit_agent_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
